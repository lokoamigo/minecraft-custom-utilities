name: MinecraftCustomUtilities
version: '${project.version}'
main: local.fastminecarts.MinecraftCustomUtilitiesPlugin
description: Raises the maximum speed of player-ridden minecarts without enabling Minecart Improvements.
api-version: '26.3'

commands:
  elytraslot:
    description: Opens your additional Elytra equipment slot.
    usage: /elytraslot
  killphantoms:
    description: Kills phantoms near the player.
    usage: /killphantoms [radius]
    permission: fastminecarts.admin

permissions:
  fastminecarts.admin:
    description: Allows changing and reloading Minecraft Custom Utilities settings.
    default: op
  minecraftcustomutilities.lecternedit:
    description: Allows editing writable books directly on lecterns while sneaking.
    default: true
