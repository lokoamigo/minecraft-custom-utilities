name: MinecraftCustomUtilities
version: '${project.version}'
main: local.fastminecarts.MinecraftCustomUtilitiesPlugin
description: Raises the maximum speed of player-ridden minecarts without enabling Minecart Improvements.
api-version: '26.3'

commands:
  mcu:
    description: Lists all Minecraft Custom Utilities commands.
    usage: /mcu [help]
  elytraslot:
    description: Opens your additional Elytra equipment slot.
    usage: /elytraslot
  quickopen:
    description: Opens the shulker box held in your main hand or offhand.
    usage: /quickopen
  shopkeeper:
    description: Configures a shopkeeper selected with a named shovel.
    usage: /shopkeeper <price <item> <emeralds>|unprice <item>|radius <blocks>|speed <multiplier>|health <points>|name <name...>|info>
  killphantoms:
    description: Kills phantoms near the player.
    usage: /killphantoms [radius]
    permission: fastminecarts.admin
  shulkerfind:
    description: Finds requested items in shulker boxes in your inventory.
    usage: /shulkerfind [locate] <item> [quantity] [<item> [quantity] ...]

permissions:
  fastminecarts.admin:
    description: Allows changing and reloading Minecraft Custom Utilities settings.
    default: op
  minecraftcustomutilities.lecternedit:
    description: Allows editing writable books directly on lecterns while sneaking.
    default: true
