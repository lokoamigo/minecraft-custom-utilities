name: FastMinecarts
version: 1.0.0
main: local.fastminecarts.FastMinecartsPlugin
description: Raises the maximum speed of player-ridden minecarts without enabling Minecart Improvements.
api-version: '26.2'

permissions:
  fastminecarts.admin:
    description: Allows changing and reloading FastMinecarts settings.
    default: op
