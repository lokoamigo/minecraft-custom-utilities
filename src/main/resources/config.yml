# Vanilla minecart maximum speed:
# 0.4 blocks/tick × 20 ticks/sec = 8 blocks/sec
#speed-blocks-per-second: 8.0

# 0 disables FastMinecarts' additional acceleration,
# leaving acceleration entirely to vanilla Minecraft.
#acceleration-blocks-per-second-squared: 0.0

# Maximum speed while approaching or riding curved rails.
#curve-speed-blocks-per-second: 8.0

# Vanilla minecarts slow down more when empty.
#slow-when-empty: true

# Only relevant when custom acceleration is enabled.
# false preserves normal rail behavior.
#boost-on-all-rails: false


# speed defaults
speed-blocks-per-second: 8.0
acceleration-blocks-per-second-squared: 0.0
curve-speed-blocks-per-second: 12.0
slow-when-empty: true
boost-on-all-rails: false

# Ghasts accelerate toward this travel speed while their AI is moving them.
ghast-speed-blocks-per-second: 20.0

# A low value gives Ghasts time to build up to their maximum speed.
ghast-acceleration-blocks-per-second-squared: 2.0
