services:
  paper:
    build:
      context: .
      dockerfile: Dockerfile.paper
      args:
        APP_VERSION: "${APP_VERSION:-1.3.4}"
    image: minecraft-custom-utilities-paper:local
    container_name: minecraft-custom-utilities-paper
    restart: unless-stopped
    ports:
      - "${MC_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-26.3}"
      MEMORY: "${MC_MEMORY:-2G}"
      MOTD: "Minecraft Custom Utilities + WorldEdit"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-minecraft-custom-utilities}"
      RCON_PORT: "25575"
      MODRINTH_PROJECTS: |
        worldedit
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    volumes:
      - paper-data:/data
    stdin_open: true
    tty: true

volumes:
  paper-data:
    # Retain the data created under the repository's former Compose project name.
    name: mc-faster-minecarts_paper-data
    external: true
