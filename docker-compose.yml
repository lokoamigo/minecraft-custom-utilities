services:
  paper:
    build:
      context: .
      dockerfile: Dockerfile.paper
      args:
        APP_VERSION: "${APP_VERSION:-1.1.0-SNAPSHOT}"
    image: fastminecarts-paper:local
    container_name: fastminecarts-paper
    restart: unless-stopped
    ports:
      - "${MC_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-26.3}"
      MEMORY: "${MC_MEMORY:-2G}"
      MOTD: "FastMinecarts + WorldEdit"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:-fastminecarts}"
      RCON_PORT: "25575"
      MODRINTH_PROJECTS: |
        worldedit
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    volumes:
      - paper-data:/data
    stdin_open: true
    tty: true

volumes:
  paper-data:
