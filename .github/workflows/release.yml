name: Prepare Minecraft Custom Utilities Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional version; leave blank for the next patch release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: minecraft-custom-utilities-release
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          CURRENT_VERSION=$(sed -n 's/.*<revision>\([^<]*\)<\/revision>.*/\1/p' pom.xml)
          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Current POM version is not a release version: '$CURRENT_VERSION'." >&2
            exit 1
          fi

          if [[ -z "$RELEASE_VERSION" ]]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            RELEASE_VERSION="$MAJOR.$MINOR.$((10#$PATCH + 1))"
            echo "No version supplied; preparing next patch release $RELEASE_VERSION."
          fi

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must use the form 1.2.3; got '$RELEASE_VERSION'." >&2
            exit 1
          fi

          RELEASE_TAG="v$RELEASE_VERSION"

          if [[ "$RELEASE_VERSION" == "$CURRENT_VERSION" ]] || \
             [[ "$(printf '%s\n%s\n' "$CURRENT_VERSION" "$RELEASE_VERSION" | sort -V | tail -n 1)" != "$RELEASE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION must be newer than $CURRENT_VERSION." >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag $RELEASE_TAG already exists; release tags must not be reused." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; releases must not be reused." >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Preparing Minecraft Custom Utilities $RELEASE_VERSION ($RELEASE_TAG)." >> "$GITHUB_STEP_SUMMARY"

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: ./scripts/set-version.sh "$RELEASE_VERSION"

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: ./scripts/verify-release.sh "$RELEASE_TAG"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd target
          sha256sum MinecraftCustomUtilities.jar > MinecraftCustomUtilities.jar.sha256

      - name: Create and push release commit and tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Setting version $RELEASE_VERSION did not change the repository." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml .env.example Dockerfile.paper docker-compose.yml
          git commit -m "Release $RELEASE_VERSION"
          git tag "$RELEASE_TAG"
          git push --atomic origin \
            "HEAD:refs/heads/$DEFAULT_BRANCH" \
            "refs/tags/$RELEASE_TAG"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            target/MinecraftCustomUtilities.jar \
            target/MinecraftCustomUtilities.jar.sha256 \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Minecraft Custom Utilities $RELEASE_VERSION"

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          git tag --force latest "$RELEASE_SHA"
          git push origin refs/tags/latest --force

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              target/MinecraftCustomUtilities.jar \
              target/MinecraftCustomUtilities.jar.sha256 \
              --clobber
            gh release edit latest \
              --title "Latest Minecraft Custom Utilities Build" \
              --notes "Automatically built from commit $RELEASE_SHA" \
              --latest
          else
            gh release create latest \
              target/MinecraftCustomUtilities.jar \
              target/MinecraftCustomUtilities.jar.sha256 \
              --title "Latest Minecraft Custom Utilities Build" \
              --notes "Automatically built from commit $RELEASE_SHA" \
              --latest
          fi
