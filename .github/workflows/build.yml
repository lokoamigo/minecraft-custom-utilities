name: Build Minecraft Custom Utilities

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: minecraft-custom-utilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./scripts/verify-release.sh "$GITHUB_REF_NAME"
          else
            ./scripts/verify-release.sh
          fi

          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare MinecraftCustomUtilities.jar
        shell: bash
        run: |
          mkdir -p dist

          JAR=target/MinecraftCustomUtilities.jar

          if [ ! -f "$JAR" ]; then
            echo "Could not find built plugin JAR."
            exit 1
          fi

          echo "Using $JAR"
          cp "$JAR" dist/MinecraftCustomUtilities.jar

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-Custom-Utilities-${{ env.APP_VERSION }}
          path: dist/MinecraftCustomUtilities.jar

      - name: Create version release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/MinecraftCustomUtilities.jar \
            --title "Minecraft Custom Utilities $APP_VERSION" \
            --generate-notes

      - name: Update latest release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Move the "latest" tag to this commit
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          # Create or update the GitHub release
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/MinecraftCustomUtilities.jar --clobber

            gh release edit latest \
              --title "Latest Minecraft Custom Utilities Build" \
              --notes "Automatically built from commit $GITHUB_SHA" \
              --latest
          else
            gh release create latest \
              dist/MinecraftCustomUtilities.jar \
              --title "Latest Minecraft Custom Utilities Build" \
              --notes "Automatically built from commit $GITHUB_SHA" \
              --latest
          fi
