name: Build FastMinecarts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: fastminecarts-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode clean package

      - name: Prepare FastMinecarts.jar
        shell: bash
        run: |
          mkdir -p dist

          JAR=$(find target \
            -maxdepth 1 \
            -type f \
            -name "*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            ! -name "original-*.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Could not find built plugin JAR."
            exit 1
          fi

          echo "Using $JAR"
          cp "$JAR" dist/FastMinecarts.jar

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: FastMinecarts
          path: dist/FastMinecarts.jar

      - name: Update latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Move the "latest" tag to this commit
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

          # Create or update the GitHub release
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest dist/FastMinecarts.jar --clobber

            gh release edit latest \
              --title "Latest FastMinecarts Build" \
              --notes "Automatically built from commit $GITHUB_SHA" \
              --latest
          else
            gh release create latest \
              dist/FastMinecarts.jar \
              --title "Latest FastMinecarts Build" \
              --notes "Automatically built from commit $GITHUB_SHA" \
              --latest
          fi